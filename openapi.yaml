openapi: 3.1.0
info:
  title: grapesjs-storage REST contract
  version: 1.2.0
  license:
    name: MIT
    identifier: MIT
  description: |
    What `RestContentStore` expects from a server. Paths are relative to the base URL the plugin
    is given (`store: new RestContentStore({ url })`); authentication is the host's business (the
    `headers` option, cookies with `credentials`).

    - **Templates** are groups of fields made in the editor's form (`string`, `number`, `date`,
      `text`, `html`). A template write has no version: the last write wins. Deleting a template
      deletes its entries. (Before 1.0 templates were designs with fields marked in them; a server
      may still send and keep `data`, the editor no longer uses it.)
    - **Entries** are values for a template's fields under a name and an address (`slug`). Next
      to grapesjs-site-pages an entry is the data of a page: its id is the page record's id. They
      have a `version` (also the `ETag`); `If-Match: "7"` makes a write, delete or publish
      conditional (`412` when the entry moved on). A first write creates the entry (`201`).
    - **Values** are by field name. A write sets the keys it sends; `null` deletes a key; keys not
      sent stay.
    - **Languages** (since 1.2, optional): `GET/PUT /languages` keep the site's languages
      (`{ default: "uk-ua", enabled: ["uk-ua", "en-gb"] }`). A field with `translatable: true` then
      holds a value per language: `{ "uk-ua": …, "en-gb": … }` (codes: language-region, lower case);
      a translated `group` / `repeater` holds its whole value per language. A missing language
      falls back to the default one. The editor publishes the default language; a server fills the
      other languages into the elements with `data-storage-field` for the language of the address.
    - Errors are `{"error": "…"}`; invalid input `422` with `{"errors": {"field": ["…"]}}`.

    luna-pages implements this contract under `/v1/content` (and `/internal/v1/apps/{app}/content`).
servers:
  - url: https://cms.example.org/api/content
    description: Any base URL
# Authentication is up to the host (a session cookie, a key added by its backend): none here.
security:
  - {}
tags:
  - name: templates
    description: Templates and their fields.
  - name: entries
    description: Entries of templates.
  - name: languages
    description: The languages of the site's data.
paths:
  /templates:
    get:
      tags: [templates]
      summary: List templates
      operationId: listTemplates
      description: Every template with its fields, without the design.
      responses:
        "200":
          description: The templates.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Template" } }
                required: [items]
        "401": { $ref: "#/components/responses/Unauthorized" }
  /templates/{id}:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    get:
      tags: [templates]
      summary: Get a template
      operationId: getTemplate
      description: The template with its design (`data`) when the server has one.
      responses:
        "200":
          description: The template.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TemplateWithData" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [templates]
      summary: Save a template's fields
      operationId: saveTemplate
      description: Replaces the fields; `name` is required to create one; `data` replaces the design when sent.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TemplateWrite" }
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Template" }
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Template" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Invalid" }
    delete:
      tags: [templates]
      summary: Delete a template
      operationId: deleteTemplate
      description: Deletes the template and its entries.
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /entries:
    get:
      tags: [entries]
      summary: List entries
      operationId: listEntries
      description: Entries of a template (all without `template`); `values` may be left out.
      parameters:
        - name: template
          in: query
          schema: { type: string }
      responses:
        "200":
          description: The entries.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Entry" } }
                required: [items]
        "401": { $ref: "#/components/responses/Unauthorized" }
  /entries/{id}:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    get:
      tags: [entries]
      summary: Get an entry
      operationId: getEntry
      responses:
        "200":
          description: The entry with its values.
          headers: { ETag: { $ref: "#/components/headers/ETag" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Entry" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [entries]
      summary: Create or replace an entry
      operationId: putEntry
      parameters:
        - { $ref: "#/components/parameters/IfMatch" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EntryWrite" }
      responses:
        "200":
          description: Saved.
          headers: { ETag: { $ref: "#/components/headers/ETag" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Entry" }
        "201":
          description: Created.
          headers: { ETag: { $ref: "#/components/headers/ETag" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Entry" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "412": { $ref: "#/components/responses/Precondition" }
        "422": { $ref: "#/components/responses/Invalid" }
    delete:
      tags: [entries]
      summary: Delete an entry
      operationId: deleteEntry
      parameters:
        - { $ref: "#/components/parameters/IfMatch" }
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "412": { $ref: "#/components/responses/Precondition" }
  /entries/{id}/publish:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    post:
      tags: [entries]
      summary: Publish an entry
      operationId: publishEntry
      description: Optional for a server; the values go live (the server checks them against the fields).
      parameters:
        - { $ref: "#/components/parameters/IfMatch" }
      responses:
        "200":
          description: Live.
          headers: { ETag: { $ref: "#/components/headers/ETag" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Entry" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "412": { $ref: "#/components/responses/Precondition" }
        "422": { $ref: "#/components/responses/Invalid" }
  /languages:
    get:
      tags: [languages]
      summary: The site's languages
      operationId: getLanguages
      description: '`404` (or no such route): the site has no languages, fields are not translated.'
      responses:
        "200":
          description: The languages.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Languages" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [languages]
      summary: Set the site's languages
      operationId: putLanguages
      description: The default first in `enabled`. An empty `enabled` clears them.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Languages" }
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Languages" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Invalid" }
components:
  parameters:
    ID:
      name: id
      in: path
      required: true
      description: The editor makes ids (UUIDs).
      schema: { type: string }
    IfMatch:
      name: If-Match
      in: header
      description: The version the edit is based on, e.g. `"7"`.
      schema: { type: string }
  headers:
    ETag:
      description: The entry's version, quoted.
      schema: { type: string }
  responses:
    Unauthorized:
      description: Not signed in, or not allowed (what the host requires).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: No such record.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Precondition:
      description: The entry changed since the version in If-Match.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Invalid:
      description: Invalid input.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ValidationError" }
  schemas:
    Error:
      type: object
      properties:
        error: { type: string }
      required: [error]
    ValidationError:
      type: object
      properties:
        error: { type: string }
        errors:
          type: object
          additionalProperties: { type: array, items: { type: string } }
      required: [error, errors]
    Field:
      type: object
      description: A field like ACF's; the settings a type does not use are left out.
      properties:
        name: { type: string, pattern: "^[a-z][a-z0-9_]{0,63}$" }
        type:
          type: string
          enum: [text, textarea, number, range, email, url, wysiwyg, image, file, gallery, select, checkbox, radio, button_group, true_false, link, page_link, date, datetime, time, color, group, repeater, tab, accordion, message]
        label: { type: string }
        required: { type: boolean }
        translatable: { type: boolean, description: "A value per language: `{ \"uk-ua\": …, \"en-gb\": … }` (see /languages). Not on fields inside a translatable group / repeater." }
        instructions: { type: string }
        width: { type: integer, minimum: 1, maximum: 99 }
        default: {}
        placeholder: { type: string }
        prepend: { type: string }
        append: { type: string }
        maxlength: { type: integer }
        rows: { type: integer }
        min: { type: number, description: "number / range: the smallest value; repeater / gallery: the fewest items." }
        max: { type: number }
        step: { type: number }
        choices: { type: array, items: { type: object, properties: { value: { type: string }, label: { type: string } }, required: [value, label] } }
        multiple: { type: boolean }
        allowNull: { type: boolean }
        layout: { type: string, enum: [vertical, horizontal, block, table, row] }
        onText: { type: string }
        offText: { type: string }
        format: { type: string, description: "date / datetime / time: display format, e.g. `DD.MM.YYYY HH:mm`." }
        fields: { type: array, items: { $ref: "#/components/schemas/Field" }, description: "group / repeater: their fields." }
        buttonLabel: { type: string }
        collapsed: { type: string, description: "repeater: the sub field shown as a row's title." }
        message: { type: string }
        open: { type: boolean }
        conditions:
          type: array
          description: Shown when any group holds; a group holds when all its rules hold. Rules compare a sibling field.
          items:
            type: array
            items:
              type: object
              properties:
                field: { type: string }
                op: { type: string, enum: ["==", "!=", empty, "!empty", contains] }
                value: { type: string }
              required: [field, op]
      required: [name, type]
    Template:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        fields: { type: array, items: { $ref: "#/components/schemas/Field" } }
        version: { type: [string, integer] }
        updated_at: { type: string, format: date-time }
      required: [id, name, fields]
    TemplateWithData:
      allOf:
        - { $ref: "#/components/schemas/Template" }
        - type: object
          properties:
            data: { type: [object, "null"], description: The GrapesJS project of the design. }
    TemplateWrite:
      type: object
      properties:
        name: { type: string }
        fields: { type: array, items: { $ref: "#/components/schemas/Field" } }
        data: { type: [object, "null"] }
      required: [fields]
    Values:
      type: object
      description: |
        By field name, as the editor stores them: strings (`wysiwyg` HTML sanitized), numbers,
        booleans (`true_false`), arrays of values (several choices, pages), `{url, alt}` /
        `{url, name}` / `{url, title, target}` (image, file, link), objects (`group`), arrays of
        objects (`repeater`, `gallery`); dates `YYYY-MM-DD`, `YYYY-MM-DDTHH:mm`, `HH:mm`.
        A `translatable` field: an object by language code (`{ "uk-ua": "Привіт", "en-gb": "Hello" }`)
        whose values have the shapes above.
      additionalProperties: true
    Languages:
      type: object
      properties:
        default: { type: string, pattern: "^[a-z]{2,3}-[a-z0-9]{2,4}$", example: uk-ua }
        enabled:
          type: array
          description: Enabled languages in order, the default first.
          items: { type: string, pattern: "^[a-z]{2,3}-[a-z0-9]{2,4}$" }
          example: [uk-ua, en-gb, pl-pl]
      required: [default, enabled]
    Entry:
      type: object
      properties:
        id: { type: string }
        template_id: { type: string }
        name: { type: string }
        slug: { type: string }
        status: { type: string, enum: [draft, published, archived] }
        values: { $ref: "#/components/schemas/Values" }
        version: { type: [string, integer] }
        updated_at: { type: string, format: date-time }
        published_at:
          type: [string, "null"]
          format: date-time
          description: When it was last published; `{{entry.published_at}}` in a template shows its date.
      required: [id, template_id, name]
    EntryWrite:
      type: object
      properties:
        template_id: { type: string }
        name: { type: string }
        slug: { type: string }
        values: { $ref: "#/components/schemas/Values" }
      required: [template_id, name]
